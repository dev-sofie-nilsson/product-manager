<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8 font-sans">

  <h1 class="text-2xl font-bold mb-6">Produktadministration</h1>

  <div class="bg-white border border-gray-300 p-6 mb-6">
    <form id="product-form">
      <div class="flex gap-4 mb-4">
        <div class="flex flex-col flex-1">
          <label class="font-bold text-sm mb-1" for="name">Produktnamn</label>
          <input class="border border-gray-400 px-2 py-1 text-sm" type="text" id="name" required>
        </div>
        <div class="flex flex-col flex-1">
          <label class="font-bold text-sm mb-1" for="price">Pris</label>
          <input class="border border-gray-400 px-2 py-1 text-sm" type="number" id="price" min="0.01" step="0.01" required>
        </div>
      </div>

      <div class="flex mb-4">
        <div class="flex flex-col w-1/2">
          <label class="font-bold text-sm mb-1" for="sku">SKU</label>
          <input class="border border-gray-400 px-2 py-1 text-sm" type="text" id="sku" required>
        </div>
      </div>

      <div class="flex flex-col mb-4">
        <label class="font-bold text-sm mb-1" for="description">Beskrivning</label>
        <textarea class="border border-gray-400 px-2 py-1 text-sm h-24 resize-y" id="description" required></textarea>
      </div>

      <p id="form-error" class="text-red-500 text-sm mb-2"></p>

      <div class="flex justify-end">
        <button type="submit" class="border border-gray-800 bg-white px-4 py-2 text-sm hover:bg-gray-100 cursor-pointer">
          Lägg till produkt
        </button>
      </div>
    </form>
  </div>

  <table class="w-full border border-gray-300 bg-white border-collapse">
    <thead>
      <tr class="bg-gray-300">
        <th class="text-left px-3 py-2 text-sm border border-gray-300">Produkt</th>
        <th class="text-left px-3 py-2 text-sm border border-gray-300">SKU</th>
        <th class="text-left px-3 py-2 text-sm border border-gray-300">Pris</th>
        <th class="px-3 py-2"></th>
      </tr>
    </thead>
    <tbody id="products-body"></tbody>
  </table>

  <script src="app.js"></script>
</body>
</html>
